name: Ежедневный пост в Telegram

on:
  schedule:
    - cron: '0 15 * * *'
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore used news keys cache
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: used_news_keys_cache.pkl
          key: used-news-keys-v2-${{ hashFiles('rss_sources.json') }}
          restore-keys: |
            used-news-keys-v2-

      - name: Install dependencies
        run: pip install requests lxml

      - name: Run script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python poster.py

      - name: Save used news keys cache
        uses: actions/cache/save@v4
        with:
          path: used_news_keys_cache.pkl
          key: used-news-keys-v2-${{ hashFiles('rss_sources.json') }}
        if: always()
